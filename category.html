<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전문가 목록 - AIConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="material-symbols-outlined logo-icon">handshake</span>
                AIConnect
            </a>
            <nav class="nav-links">
                <a href="category.html">전문가 찾기</a>
                <a href="#">서비스 요청</a>
                <a href="#">커뮤니티</a>
            </nav>
            <div class="nav-actions">
                <a href="#" class="btn-text">로그인</a>
                <a href="#" class="btn-primary">전문가 가입</a>
            </div>
        </div>
    </header>

    <div class="category-hero">
        <div class="container">
            <h1 style="font-size: 2.5rem; font-weight: 800; margin-bottom: 1rem;">디자인 전문가</h1>
            <p style="color: var(--text-secondary);">로고, 브랜딩, 웹/앱 디자인까지 검증된 전문가를 만나보세요.</p>
        </div>
    </div>

    <main class="container">
        <div class="category-page-layout">
            <aside class="filter-sidebar">
                <div class="filter-group">
                    <h4>서비스 종류</h4>
                    <label style="display: block; margin-bottom: 0.5rem;"><input type="checkbox" checked> 로고 디자인</label>
                    <label style="display: block; margin-bottom: 0.5rem;"><input type="checkbox"> UI/UX 디자인</label>
                    <label style="display: block; margin-bottom: 0.5rem;"><input type="checkbox"> 일러스트</label>
                </div>
                <div class="filter-group">
                    <h4>가격 범위</h4>
                    <input type="range" min="0" max="1000000" style="width: 100%;">
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem; margin-top: 0.5rem;">
                        <span>0원</span>
                        <span>100만원+</span>
                    </div>
                </div>
                <div class="filter-group">
                    <h4>전문가 등급</h4>
                    <label style="display: block; margin-bottom: 0.5rem;"><input type="checkbox"> TOP 전문가</label>
                    <label style="display: block; margin-bottom: 0.5rem;"><input type="checkbox"> 신규 전문가</label>
                </div>
            </aside>

            <div class="expert-list-main">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                    <span style="font-weight: 600;">총 1,245명의 전문가</span>
                    <select style="padding: 0.5rem; border-radius: 4px; border: 1px solid var(--border-color);">
                        <option>추천순</option>
                        <option>평점 높은순</option>
                        <option>가격 낮은순</option>
                    </select>
                </div>
                <div class="expert-grid" id="category-expert-grid">
                    <!-- Experts will be injected here -->
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-brand">
                <a href="#" class="logo">AIConnect</a>
                <p>당신의 아이디어를 현실로 만들어줄 전문가를 만나보세요.</p>
            </div>
            <div class="footer-links">
                <div class="link-column">
                    <h4>회사</h4>
                    <a href="#">소개</a>
                    <a href="#">채용</a>
                </div>
                <div class="link-column">
                    <h4>지원</h4>
                    <a href="#">고객센터</a>
                    <a href="#">FAQ</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            &copy; 2026 AIConnect. All rights reserved.
        </div>
    </footer>

    <script type="module" src="main.js"></script>
</body>
</html>
