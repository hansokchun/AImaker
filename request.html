<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서비스 요청 - AIConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
    <style>
        .form-group { margin-bottom: 2rem; }
        .form-group label { 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
            font-weight: 700; 
            margin-bottom: 1rem; 
            color: var(--text-primary);
            font-size: 1.1rem;
        }
        .form-group label .material-symbols-outlined {
            color: var(--primary);
            font-size: 1.25rem;
        }
        .form-control { 
            width: 100%; 
            padding: 1rem 1.25rem; 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-lg); 
            font-family: inherit; 
            font-size: 1rem;
            transition: var(--transition);
            background: #f8fafc;
        }
        .form-control:focus { 
            outline: none; 
            border-color: var(--primary); 
            background: white;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }
        @media (max-width: 768px) {
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body style="overflow-y: auto;"> <!-- Ensure scroll is enabled -->
    <header class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="material-symbols-outlined logo-icon">handshake</span>
                AIConnect
            </a>
            <nav class="nav-links">
                <a href="category.html">전문가 찾기</a>
                <a href="request.html" style="color: var(--primary);">서비스 요청</a>
                <a href="requests.html">요청 게시판</a>
                <a href="community.html">커뮤니티</a>
            </nav>
            <div class="nav-actions">
                <a href="#" class="btn-text">로그인</a>
                <a href="#" class="btn-primary">전문가 가입</a>
            </div>
        </div>
    </header>

    <div class="page-hero" style="padding-bottom: 160px; padding-top: 100px;"> <!-- Increased padding for more space -->
        <div class="container">
            <h1 class="page-title" style="margin-bottom: 1.5rem;">무료 서비스 요청</h1>
            <p style="color: rgba(255,255,255,0.8); font-size: 1.1rem;">필요한 내용을 공고로 올리고, 전문가들에게 견적을 받아보세요.</p>
        </div>
    </div>

    <main class="container" style="margin-top: -40px; padding-bottom: 100px; position: relative; z-index: 10; min-height: 600px;"> <!-- Reduced negative margin -->
        <div class="content-card" style="max-width: 900px; margin: 0 auto;">
            <form id="request-form">
                <div class="form-group">
                    <label><span class="material-symbols-outlined">category</span> 카테고리 선택 (중복 선택 가능)</label>
                    <category-selector id="category-selector"></category-selector>
                </div>

                <div class="form-group">
                    <label><span class="material-symbols-outlined">edit_note</span> 어떤 서비스가 필요하신가요?</label>
                    <input type="text" id="req-title" class="form-control" placeholder="예: 로고 디자인, 파이썬 웹 크롤러 개발" required>
                </div>

                <div class="form-group">
                    <label><span class="material-symbols-outlined">description</span> 상세 내용</label>
                    <textarea id="req-desc" class="form-control" rows="8" placeholder="전문가가 파악할 수 있도록 프로젝트의 목적, 요구사항, 참고 자료 등을 구체적으로 작성해주세요." required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label><span class="material-symbols-outlined">payments</span> 희망 예산 (원)</label>
                        <input type="number" id="req-budget" class="form-control" placeholder="예: 500,000" required>
                    </div>
                    <div class="form-group">
                        <label><span class="material-symbols-outlined">event_available</span> 마감 기한</label>
                        <input type="date" id="req-deadline" class="form-control" required>
                    </div>
                </div>

                <div style="margin-top: 2rem;">
                    <button type="submit" class="btn-primary" style="width: 100%; padding: 1.25rem; font-size: 1.2rem; border-radius: var(--radius-xl);">
                        요청서 올리기
                    </button>
                    <p style="text-align: center; color: var(--text-muted); font-size: 0.9rem; margin-top: 1rem;">
                        요청서를 올리면 관련 분야 전문가들에게 알림이 전송됩니다.
                    </p>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-brand">
                <a href="#" class="logo" style="color: white;">AIConnect</a>
                <p class="footer-desc">당신의 아이디어를 현실로 만들어줄 최고의 전문가들을 만나보세요.</p>
            </div>
            <div class="footer-links">
                <div class="link-column">
                    <h4>서비스 소개</h4>
                    <a href="#">회사 소개</a>
                    <a href="#">이용약관</a>
                </div>
                <div class="link-column">
                    <h4>고객 지원</h4>
                    <a href="#">고객센터</a>
                </div>
                <div class="link-column">
                    <h4>전문가</h4>
                    <a href="#">전문가 등록</a>
                </div>
            </div>
        </div>
        <div class="container footer-bottom">
            <p>&copy; 2026 AIConnect. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="main.js"></script>
    <script>
        document.getElementById('request-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const selector = document.getElementById('category-selector');
            const categories = Array.from(selector.selected || []);
            
            if (categories.length === 0) {
                alert('최소 하나 이상의 카테고리를 선택해주세요.');
                return;
            }

            const newRequest = {
                id: Date.now(),
                title: document.getElementById('req-title').value,
                desc: document.getElementById('req-desc').value,
                budget: document.getElementById('req-budget').value,
                deadline: document.getElementById('req-deadline').value,
                categories: categories,
                createdAt: new Date().toLocaleDateString(),
                status: 'pending'
            };

            // Save to LocalStorage
            const existingRequests = JSON.parse(localStorage.getItem('ai_requests') || '[]');
            existingRequests.push(newRequest);
            localStorage.setItem('ai_requests', JSON.stringify(existingRequests));

            alert('요청서가 성공적으로 등록되었습니다!');
            window.location.href = 'requests.html';
        });
    </script>
</body>
</html>
