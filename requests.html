<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요청 게시판 - AIConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
    <style>
        .filter-container {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: white;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
        }
        .filter-chip {
            padding: 0.5rem 1.25rem;
            border-radius: 99px;
            background: #f1f5f9;
            color: #64748b;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .filter-chip:hover {
            background: #e2e8f0;
            color: var(--text-primary);
        }
        .filter-chip.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }
        .request-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1.5rem;
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .request-item:last-child { border-bottom: none; }
        .request-item:hover { background: #f8fafc; }
        .request-info h3 { margin-bottom: 0.75rem; font-size: 1.25rem; font-weight: 700; }
        .request-tags { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .request-tag { 
            font-size: 0.75rem; 
            padding: 0.25rem 0.75rem; 
            background: #eff6ff; 
            color: var(--primary); 
            border-radius: 99px; 
            font-weight: 700;
        }
        .request-meta { display: flex; gap: 1.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        .request-meta span { display: flex; align-items: center; gap: 0.4rem; }
        .request-status { text-align: right; display: flex; flex-direction: column; justify-content: center; gap: 1rem; }
        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 700;
            background: #dcfce7;
            color: #16a34a;
        }
        .empty-state { text-align: center; padding: 5rem 2rem; color: var(--text-muted); }
        .empty-state .material-symbols-outlined { font-size: 4rem; margin-bottom: 1rem; opacity: 0.3; }
    </style>
</head>
<body>
    <header class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="material-symbols-outlined logo-icon">handshake</span>
                AIConnect
            </a>
            <nav class="nav-links">
                <a href="category.html">전문가 찾기</a>
                <a href="request.html">서비스 요청</a>
                <a href="requests.html" style="color: var(--primary);">요청 게시판</a>
                <a href="community.html">커뮤니티</a>
            </nav>
            <div class="nav-actions">
                <a href="#" class="btn-text">로그인</a>
                <a href="#" class="btn-primary">전문가 가입</a>
            </div>
        </div>
    </header>

    <div class="page-hero">
        <div class="container">
            <h1 class="page-title">서비스 요청 게시판</h1>
            <p style="color: rgba(255,255,255,0.8); font-size: 1.1rem;">등록된 모든 서비스 요청 내역을 확인하고 전문가들의 제안을 기다리세요.</p>
        </div>
    </div>

    <main class="container" style="margin-top: -3rem; padding-bottom: 8rem; position: relative; z-index: 10;">
        <div id="filter-bar" class="filter-container">
            <!-- Filter chips will be loaded here -->
        </div>

        <div class="content-card" style="padding: 0; overflow: hidden;">
            <div id="request-list">
                <!-- Requests will be loaded here via JS -->
                <div class="empty-state">
                    <span class="material-symbols-outlined">description</span>
                    <p>등록된 요청서가 없습니다.<br>첫 번째 요청서를 작성해보세요!</p>
                    <a href="request.html" class="btn-primary" style="display: inline-block; margin-top: 1.5rem;">요청서 작성하기</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-brand">
                <a href="#" class="logo" style="color: white;">AIConnect</a>
                <p class="footer-desc">당신의 아이디어를 현실로 만들어줄 최고의 전문가들을 만나보세요.</p>
            </div>
            <div class="footer-links">
                <div class="link-column">
                    <h4>서비스 소개</h4>
                    <a href="#">회사 소개</a>
                    <a href="#">이용약관</a>
                </div>
                <div class="link-column">
                    <h4>고객 지원</h4>
                    <a href="#">고객센터</a>
                </div>
                <div class="link-column">
                    <h4>전문가</h4>
                    <a href="#">전문가 등록</a>
                </div>
            </div>
        </div>
        <div class="container footer-bottom">
            <p>&copy; 2026 AIConnect. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.getElementById('request-list');
            const filterBar = document.getElementById('filter-bar');
            const requests = JSON.parse(localStorage.getItem('ai_requests') || '[]');
            
            const categories = [
                '전체', 'AI 영화 제작', 'AI 애니메이션 제작', 'AI 광고 제작 (숏폼)', 'AI 이미지 제작', 
                'AI 캐릭터 제작', 'AI 음원 만들기', 'AI 성우 입히기', 'AI 그래픽 디자인'
            ];
            
            let currentFilter = '전체';

            function renderRequests() {
                const filtered = currentFilter === '전체' 
                    ? requests 
                    : requests.filter(req => req.categories.includes(currentFilter));

                if (filtered.length > 0) {
                    listContainer.innerHTML = [...filtered].reverse().map(req => `
                        <div class="request-item">
                            <div class="request-info">
                                <div class="request-tags">
                                    ${req.categories.map(cat => `<span class="request-tag">${cat}</span>`).join('')}
                                </div>
                                <h3>${req.title}</h3>
                                <div class="request-meta">
                                    <span><span class="material-symbols-outlined" style="font-size: 1.1rem;">payments</span> ${Number(req.budget).toLocaleString()}원</span>
                                    <span><span class="material-symbols-outlined" style="font-size: 1.1rem;">calendar_month</span> 마감: ${req.deadline}</span>
                                    <span><span class="material-symbols-outlined" style="font-size: 1.1rem;">schedule</span> ${req.createdAt}</span>
                                </div>
                            </div>
                            <div class="request-status">
                                <span class="status-badge">제안 대기 중</span>
                                <button class="btn-text" style="font-size: 0.9rem; padding: 0.5rem;">상세보기</button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listContainer.innerHTML = \`
                        <div class="empty-state">
                            <span class="material-symbols-outlined">search_off</span>
                            <p>선택하신 카테고리의 요청서가 없습니다.</p>
                        </div>
                    \`;
                }
            }

            function renderFilters() {
                filterBar.innerHTML = categories.map(cat => `
                    <div class="filter-chip ${currentFilter === cat ? 'active' : ''}" data-cat="${cat}">
                        ${cat}
                    </div>
                `).join('');

                filterBar.querySelectorAll('.filter-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        currentFilter = chip.getAttribute('data-cat');
                        renderFilters();
                        renderRequests();
                    });
                });
            }

            if (requests.length > 0) {
                renderFilters();
                renderRequests();
            } else {
                filterBar.style.display = 'none';
            }
        });
    </script>
</body>
</html>
