<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요청 게시판 - AIConnect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
    <style>
        .request-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1.5rem;
            padding: 2rem;
            border-bottom: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .request-item:last-child { border-bottom: none; }
        .request-item:hover { background: #f8fafc; }
        .request-info h3 { margin-bottom: 0.75rem; font-size: 1.25rem; font-weight: 700; }
        .request-tags { display: flex; gap: 0.5rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .request-tag { 
            font-size: 0.75rem; 
            padding: 0.25rem 0.75rem; 
            background: #eff6ff; 
            color: var(--primary); 
            border-radius: 99px; 
            font-weight: 700;
        }
        .request-meta { display: flex; gap: 1.5rem; color: var(--text-secondary); font-size: 0.9rem; }
        .request-meta span { display: flex; align-items: center; gap: 0.4rem; }
        .request-status { text-align: right; display: flex; flex-direction: column; justify-content: center; gap: 1rem; }
        .status-badge {
            padding: 0.5rem 1rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 700;
            background: #dcfce7;
            color: #16a34a;
        }
        .empty-state { text-align: center; padding: 5rem 2rem; color: var(--text-muted); }
        .empty-state .material-symbols-outlined { font-size: 4rem; margin-bottom: 1rem; opacity: 0.3; }
    </style>
</head>
<body>
    <header class="navbar" id="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="material-symbols-outlined logo-icon">handshake</span>
                AIConnect
            </a>
            <nav class="nav-links">
                <a href="category.html">전문가 찾기</a>
                <a href="request.html">서비스 요청</a>
                <a href="requests.html" style="color: var(--primary);">요청 게시판</a>
                <a href="community.html">커뮤니티</a>
            </nav>
            <div class="nav-actions">
                <a href="#" class="btn-text">로그인</a>
                <a href="#" class="btn-primary">전문가 가입</a>
            </div>
        </div>
    </header>

    <div class="page-hero">
        <div class="container">
            <h1 class="page-title">서비스 요청 게시판</h1>
            <p style="color: rgba(255,255,255,0.8); font-size: 1.1rem;">등록된 모든 서비스 요청 내역을 확인하고 전문가들의 제안을 기다리세요.</p>
        </div>
    </div>

    <main class="container" style="margin-top: -3rem; padding-bottom: 8rem; position: relative; z-index: 10;">
        <div class="content-card" style="padding: 0; overflow: hidden;">
            <div id="request-list">
                <!-- Requests will be loaded here via JS -->
                <div class="empty-state">
                    <span class="material-symbols-outlined">description</span>
                    <p>등록된 요청서가 없습니다.<br>첫 번째 요청서를 작성해보세요!</p>
                    <a href="request.html" class="btn-primary" style="display: inline-block; margin-top: 1.5rem;">요청서 작성하기</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div class="footer-brand">
                <a href="#" class="logo" style="color: white;">AIConnect</a>
                <p class="footer-desc">당신의 아이디어를 현실로 만들어줄 최고의 전문가들을 만나보세요.</p>
            </div>
            <div class="footer-links">
                <div class="link-column">
                    <h4>서비스 소개</h4>
                    <a href="#">회사 소개</a>
                    <a href="#">이용약관</a>
                </div>
                <div class="link-column">
                    <h4>고객 지원</h4>
                    <a href="#">고객센터</a>
                </div>
                <div class="link-column">
                    <h4>전문가</h4>
                    <a href="#">전문가 등록</a>
                </div>
            </div>
        </div>
        <div class="container footer-bottom">
            <p>&copy; 2026 AIConnect. All rights reserved.</p>
        </div>
    </footer>

    <script type="module" src="main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const listContainer = document.getElementById('request-list');
            const requests = JSON.parse(localStorage.getItem('ai_requests') || '[]');

            if (requests.length > 0) {
                listContainer.innerHTML = requests.reverse().map(req => `
                    <div class="request-item">
                        <div class="request-info">
                            <div class="request-tags">
                                ${req.categories.map(cat => `<span class="request-tag">${cat}</span>`).join('')}
                            </div>
                            <h3>${req.title}</h3>
                            <div class="request-meta">
                                <span><span class="material-symbols-outlined" style="font-size: 1.1rem;">payments</span> ${Number(req.budget).toLocaleString()}원</span>
                                <span><span class="material-symbols-outlined" style="font-size: 1.1rem;">calendar_month</span> 마감: ${req.deadline}</span>
                                <span><span class="material-symbols-outlined" style="font-size: 1.1rem;">schedule</span> ${req.createdAt}</span>
                            </div>
                        </div>
                        <div class="request-status">
                            <span class="status-badge">제안 대기 중</span>
                            <button class="btn-text" style="font-size: 0.9rem; padding: 0.5rem;">상세보기</button>
                        </div>
                    </div>
                `).join('');
            }
        });
    </script>
</body>
</html>
